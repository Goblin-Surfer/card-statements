<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>分析 | カード利用明細</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-client.js"></script>
<style>
  :root {
    --bg: #F5F2EA; --card: #FFFFFF; --border: #DDD6C8; --border-light: #D9D2C3;
    --text: #211F1A; --text-sub: #4A463D; --text-muted: #6B665A;
    --blue: #2A78D6; --error-bg: #FBE1DD; --error-text: #8C2E22;
    --good: #006300; --bad: #D03B3B;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Noto Sans JP', sans-serif; }
  button, input, select { font-family: inherit; }
  a { color: var(--text-sub); }
  a:hover { color: var(--text); }

  header { box-sizing: border-box; padding: 0 24px; height: 64px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: #FFFFFF; border-bottom: 1px solid var(--border); }
  header .brand { font-size: 18px; font-weight: 700; margin-right: 24px; color: var(--text); text-decoration: none; cursor: pointer; }
  header .brand:hover { color: var(--blue); }
  nav { display: flex; align-items: stretch; gap: 4px; flex-wrap: wrap; }
  nav a { display: flex; align-items: center; padding: 0 12px; height: 64px; font-size: 14px; font-weight: 500; text-decoration: none; color: var(--text-sub); border-bottom: 3px solid transparent; white-space: nowrap; }
  nav a.active { color: var(--text); font-weight: 700; border-bottom-color: var(--blue); }

  main { max-width: 1200px; margin: 0 auto; padding: 24px 20px 60px; display: flex; flex-direction: column; gap: 20px; }

  .top-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .title-nav { display: flex; align-items: center; gap: 8px; }
  h1 { margin: 0 16px 0 0; font-size: 22px; font-weight: 700; }
  .icon-btn { width: 44px; height: 44px; border: 1.5px solid var(--border-light); border-radius: 12px; background: #FFFFFF; color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; }
  .month-label { min-width: 150px; text-align: center; font-size: 18px; font-weight: 700; }

  section.panel { box-sizing: border-box; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }

  .hero { display: flex; align-items: center; gap: 32px; flex-wrap: wrap; }
  .hero-main { display: flex; flex-direction: column; gap: 4px; }
  .hero-main .label { font-size: 14px; font-weight: 700; color: var(--text-sub); }
  .hero-main .value-row { display: flex; align-items: baseline; gap: 6px; }
  .hero-main .value { font-size: 44px; font-weight: 700; line-height: 1.1; }
  .hero-main .unit { font-size: 16px; font-weight: 500; color: var(--text-sub); }
  .hero-main .delta { font-size: 13px; font-weight: 500; }
  .hero-divider { width: 1px; align-self: stretch; background: #ECE6D8; }
  .hero-cards { flex-grow: 1; display: flex; gap: 12px; flex-wrap: wrap; }
  .hero-card { flex: 1; min-width: 140px; box-sizing: border-box; padding: 12px 16px; background: var(--bg); border-radius: 12px; display: flex; flex-direction: column; gap: 4px; }
  .hero-card .name { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--text-sub); }
  .hero-card .amount { font-size: 20px; font-weight: 700; }
  .hero-card .payday { font-size: 12px; color: var(--text-muted); }

  .cols { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
  .col-left { flex: 1.2; min-width: 380px; display: flex; flex-direction: column; gap: 20px; }
  .col-right { flex: 1; min-width: 320px; display: flex; flex-direction: column; gap: 20px; }

  .panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .panel-head h2 { margin: 0; font-size: 16px; font-weight: 700; }
  .panel-head .sub { font-size: 12px; color: var(--text-muted); }
  .trend-nav { display: flex; align-items: center; gap: 8px; margin: 10px 0 6px; flex-wrap: wrap; }
  .trend-nav .nav-btn { min-height: 34px; padding: 0 12px; border: 1.5px solid var(--border-light); border-radius: 17px; background: #FFFFFF; color: var(--text); font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; }
  .trend-nav .nav-btn:disabled { color: var(--text-muted); opacity: 0.45; cursor: default; }
  .trend-nav .trend-range { flex: 1; min-width: 120px; text-align: center; font-size: 13px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  #trend-chart-view .chart-wrap { touch-action: pan-y; user-select: none; isolation: isolate; }
  /* 選択中の月の帯は線の下に敷く（帯が線を隠して点と線が切れて見えないように） */
  #trend-groups .bar-group.active { background: transparent; }
  #trend-groups .bar-group.active::before { content: ""; position: absolute; inset: 0; background: #F0EADB; z-index: -1; }
  .span-select { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .span-select .span-label { font-size: 12px; color: var(--text-muted); margin-right: 2px; }
  .span-chip { min-height: 30px; padding: 0 12px; border: 1.5px solid var(--border-light); border-radius: 15px; background: #FFFFFF; color: var(--text-sub); font-size: 12px; font-weight: 500; cursor: pointer; font-family: inherit; }
  .span-chip.active { background: var(--text); border-color: var(--text); color: #FFFFFF; font-weight: 700; }
  #bycard-groups .bar-group { min-width: 0; }
  #bycard-groups.stacked .bar-group { gap: 0; }
  .stack { display: flex; flex-direction: column-reverse; width: 60%; max-width: 22px; min-width: 3px; }
  .stack .seg { display: block; width: 100%; }
  .stack .seg + .seg { border-bottom: 1px solid #FFFFFF; }
  .stack .seg:last-child { border-radius: 3px 3px 0 0; }
  .toggle-btn { white-space: nowrap; flex-shrink: 0; min-height: 36px; padding: 0 14px; border: 1.5px solid var(--border-light); border-radius: 18px; background: #FFFFFF; color: var(--text); font-size: 12px; font-weight: 500; cursor: pointer; }

  .legend { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .legend span { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-sub); }
  .sq { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  .chart-wrap { position: relative; height: 160px; margin-left: 48px; }
  .chart-ticks div { position: absolute; left: 0; right: 0; border-top: 1px solid #E6E0D3; height: 0; }
  .chart-ticks div.zero { border-top-color: #C9C2B2; }
  .chart-ticks span { position: absolute; left: -48px; width: 42px; text-align: right; top: -7px; font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .chart-labels { display: flex; margin-left: 48px; }
  .chart-labels span { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; white-space: nowrap; font-size: 12px; color: var(--text-muted); }
  .chart-labels span small { font-size: 10px; font-weight: 400; color: var(--text-muted); line-height: 1.2; }
  .chart-labels span.active { font-weight: 700; color: var(--text); }
  .readout { margin: 0 0 12px; min-height: 20px; font-size: 13px; color: var(--text-sub); }
  .readout strong { font-size: 15px; color: var(--text); }

  .bar-groups { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; align-items: flex-end; }
  .bar-group { flex: 1; height: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 3px; border: none; background: transparent; cursor: pointer; padding: 0; position: relative; }
  .bar-group.active { background: #F0EADB; }
  .bar-group.hovered .dot { box-shadow: 0 0 0 5px rgba(42,120,214,0.22); }
  .chart-tooltip { position: absolute; transform: translateX(-50%); background: var(--text); color: #FFFFFF; font-size: 12px; font-weight: 600; padding: 5px 9px; border-radius: 6px; white-space: nowrap; pointer-events: none; z-index: 5; box-shadow: 0 2px 6px rgba(0,0,0,0.18); }
  .chart-tooltip::after { content: ""; position: absolute; top: 100%; left: var(--arrow-x, 50%); transform: translateX(-50%); border: 5px solid transparent; border-top-color: var(--text); }
  .chart-tooltip.hidden { display: none; }
  /* 点がグラフの上端近くにあるときは吹き出しを点の下に出す（上の文字に重ならないように） */
  .chart-tooltip.below::after { top: auto; bottom: 100%; border-top-color: transparent; border-bottom-color: var(--text); }
  .bar { display: block; width: 16px; border-radius: 4px 4px 0 0; }

  table.month-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.month-table th, table.month-table td { text-align: left; padding: 8px 0; border-bottom: 1px solid #ECE6D8; font-variant-numeric: tabular-nums; }
  table.month-table th { font-size: 12px; color: var(--text-muted); border-bottom: 1px solid #C9C2B2; }
  table.month-table td.num { text-align: right; font-weight: 700; }

  .merchant-row { display: flex; align-items: center; gap: 12px; min-height: 40px; border-top: 1px solid #ECE6D8; }
  .merchant-row:first-child { border-top: none; }
  .merchant-name { width: 110px; flex-shrink: 0; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .merchant-bar-wrap { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .merchant-bar { display: block; height: 14px; background: var(--blue); border-radius: 0 4px 4px 0; }
  .merchant-value { font-size: 13px; font-weight: 700; white-space: nowrap; }
  .merchant-share { font-weight: 400; color: var(--text-muted); margin-left: 6px; }
  .insight-line { font-size: 14px; line-height: 1.7; color: var(--text-sub); margin: 0 0 10px; }
  .insight-line:last-child { margin-bottom: 0; }
  .insight-section { padding: 12px 0; border-top: 1px solid #ECE6D8; }
  .insight-section:first-child { border-top: none; padding-top: 4px; }
  .insight-section h3 { margin: 0 0 6px; font-size: 13px; font-weight: 700; color: var(--text); }
  .insight-section .insight-line { margin: 0 0 6px; }
  .insight-points { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .insight-points li { padding: 10px 12px 10px 14px; border-radius: 10px; background: #F7F4EC; border-left: 4px solid #C9C2B2; font-size: 14px; line-height: 1.7; color: var(--text-sub); }
  .insight-points li.tone-good { border-left-color: var(--good); }
  .insight-points li.tone-bad { border-left-color: var(--bad); }
  .insight-details { margin-top: 12px; }
  .insight-details summary { cursor: pointer; list-style: none; padding: 6px 0; font-size: 13px; font-weight: 700; color: var(--blue); }
  .insight-details summary::-webkit-details-marker { display: none; }
  .insight-details summary::before { content: '▸ '; }
  .insight-details[open] summary::before { content: '▾ '; }
  .insight-breakdown { margin: 0; padding: 0; list-style: none; font-size: 13px; line-height: 1.8; color: var(--text-sub); font-variant-numeric: tabular-nums; }
  .insight-breakdown li { display: flex; justify-content: space-between; gap: 12px; }
  .insight-breakdown li.total { border-top: 1px solid #ECE6D8; margin-top: 2px; padding-top: 2px; font-weight: 700; color: var(--text); }
  .insight-note { margin: 10px 0 0; font-size: 11px; line-height: 1.6; color: var(--text-muted); }

  .hero-sub-stat { margin: 4px 0 0; font-size: 13px; color: var(--text-sub); }

  .fixed-summary { display: flex; gap: 12px; flex-wrap: wrap; }
  .fixed-tile { flex: 1; min-width: 130px; box-sizing: border-box; padding: 12px 16px; background: var(--bg); border-radius: 12px; display: flex; flex-direction: column; gap: 4px; }
  .fixed-tile .name { font-size: 13px; font-weight: 700; color: var(--text-sub); }
  .fixed-tile .amount { font-size: 20px; font-weight: 700; }
  .fixed-tile.total { background: #EAF1FB; }
  .fixed-tile.total .amount { color: #1F4E8C; }
  .fixed-ratio-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 14px; background: #EAF1FB; color: #1F4E8C; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .fixed-item-list { display: flex; flex-direction: column; }
  .fixed-item-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid #ECE6D8; font-size: 14px; }
  .fixed-item-row:first-child { border-top: none; }
  .fixed-item-row .amount { font-weight: 700; font-variant-numeric: tabular-nums; }
  .fixed-diff-note { margin: 0 0 6px; font-size: 13px; line-height: 1.6; color: var(--text-sub); }
  .fixed-diff-note:last-child { margin-bottom: 0; }

  .notice { box-sizing: border-box; padding: 14px 16px; background: #EAF1FB; border: 1px solid #CBDFF5; border-radius: 10px; font-size: 13px; line-height: 1.6; color: #1F4E8C; }
  .error-banner { box-sizing: border-box; padding: 12px 14px; background: var(--error-bg); color: var(--error-text); border-radius: 10px; font-size: 13px; line-height: 1.6; }
  .empty { padding: 24px 4px; text-align: center; font-size: 13px; color: var(--text-muted); }
  .hidden { display: none !important; }
  .muted { color: var(--text-muted); font-size: 13px; }

  /* ===== モバイル対応 ===== */
  @media (max-width: 680px) {
    header { height: auto; min-height: 56px; padding: 8px 14px; flex-wrap: nowrap; }
    header .brand { font-size: 15px; margin-right: 10px; flex-shrink: 0; }
    nav { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    nav::-webkit-scrollbar { display: none; }
    nav a { height: 40px; padding: 0 10px; font-size: 13px; }

    main { padding: 16px 12px 40px; gap: 14px; }
    h1 { font-size: 19px; margin-right: 8px; }
    .month-label { min-width: 110px; font-size: 15px; }
    .icon-btn { width: 38px; height: 38px; }

    section.panel { padding: 16px; }
    .cols { gap: 14px; }
    .col-left, .col-right { flex: 1 1 100%; min-width: 0; }

    .hero { gap: 14px; }
    .hero-divider { display: none; }
    .hero-main .value { font-size: 30px; }
    .hero-cards { gap: 8px; }
    .hero-card { min-width: 120px; }

    .fixed-summary { gap: 8px; }
    .fixed-tile { min-width: 100px; padding: 10px 12px; }
    .fixed-tile .amount { font-size: 17px; }
    .panel-head { align-items: center; }

    .chart-wrap { margin-left: 34px; }
    .trend-nav .trend-range { order: -1; flex-basis: 100%; text-align: left; }
    .trend-nav .nav-btn { padding: 0 10px; }
    .bar-group { min-width: 0; }
    .chart-ticks span { left: -34px; width: 30px; font-size: 10px; }
    .chart-labels { margin-left: 34px; }

    table.month-table { display: block; overflow-x: auto; }
    .merchant-name { width: 84px; font-size: 13px; }
  }
</style>
</head>
<body>

  <header>
    <a href="./list.html" class="brand">カード利用明細</a>
    <nav aria-label="メイン">
      <a href="./list.html">明細一覧</a>
      <a href="./input.html">手入力</a>
      <a href="./analysis.html" class="active" aria-current="page">分析</a>
      <a href="./knowledge.html">ナレッジ</a>
      <a href="./cards.html">カード設定</a>
      <a href="./logs.html">取得ログ</a>
    </nav>
  </header>

  <main>
    <p id="error-banner" class="error-banner hidden"></p>

    <div class="top-row">
      <div class="title-nav">
        <h1>分析</h1>
        <button type="button" class="icon-btn" id="prev-month" aria-label="前の支払月">←</button>
        <span class="month-label" id="month-label"></span>
        <button type="button" class="icon-btn" id="next-month" aria-label="次の支払月">→</button>
      </div>
    </div>

    <section class="panel">
      <div id="hero-loading" class="muted">読み込み中…</div>
      <div id="hero" class="hero hidden">
        <div class="hero-main">
          <span class="label" id="hero-label"></span>
          <div class="value-row">
            <span class="value" id="hero-total">0</span>
            <span class="unit">円</span>
          </div>
          <span class="delta" id="hero-delta"></span>
          <p class="hero-sub-stat" id="hero-shared"></p>
        </div>
        <div class="hero-divider"></div>
        <div class="hero-cards" id="hero-cards"></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <h2>固定費・インフラ費用</h2>
          <div class="sub" id="fixed-sub"></div>
        </div>
        <span class="fixed-ratio-badge" id="fixed-ratio-badge"></span>
      </div>
      <div class="fixed-summary" id="fixed-summary"></div>
      <div class="fixed-item-list" id="fixed-item-list"></div>
      <div id="fixed-empty" class="empty hidden">この月は固定費に分類された明細がありません。</div>
      <div id="fixed-diff-notes"></div>
    </section>

    <div class="cols">
      <div class="col-left">

        <section class="panel">
          <div class="panel-head">
            <div>
              <h2>全カード合計の推移</h2>
              <div class="sub">点に触れると金額、クリックでその月を表示。左右スワイプで移動</div>
            </div>
            <button type="button" class="toggle-btn" id="trend-toggle">表で見る</button>
          </div>
          <div class="span-select" role="group" aria-label="表示期間">
            <span class="span-label">表示期間</span>
            <button type="button" class="span-chip" data-span="6">6か月</button>
            <button type="button" class="span-chip" data-span="12">1年</button>
            <button type="button" class="span-chip" data-span="24">2年</button>
            <button type="button" class="span-chip" data-span="all">全期間</button>
          </div>
          <div class="trend-nav">
            <button type="button" class="nav-btn" id="trend-older" aria-label="グラフを前の期間へ移動">‹ 前へ</button>
            <span class="trend-range" id="trend-range"></span>
            <button type="button" class="nav-btn" id="trend-newer" aria-label="グラフを次の期間へ移動">次へ ›</button>
            <button type="button" class="nav-btn" id="trend-latest">最新</button>
          </div>
          <div id="trend-chart-view">
            <p class="readout" id="trend-readout"></p>
            <div class="chart-wrap">
              <div class="chart-ticks" id="trend-ticks"></div>
              <svg id="trend-svg" width="100%" height="160" viewBox="0 0 600 160" preserveAspectRatio="none" style="position:absolute;left:0;top:0;overflow:visible;">
                <polyline id="trend-line" fill="none" stroke="#2A78D6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></polyline>
              </svg>
              <div class="bar-groups" id="trend-groups"></div>
              <div class="chart-tooltip hidden" id="trend-tooltip"></div>
            </div>
            <div class="chart-labels" id="trend-labels"></div>
          </div>
          <div id="trend-table-view" class="hidden">
            <table class="month-table">
              <thead><tr><th>支払月</th><th style="text-align:right;">合計</th></tr></thead>
              <tbody id="trend-table-body"></tbody>
            </table>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <div>
              <h2>カードごと・月ごとの合計金額</h2>
              <div class="sub" id="bycard-sub"></div>
            </div>
            <div class="legend" id="bycard-legend"></div>
          </div>
          <div class="chart-wrap">
            <div class="chart-ticks" id="bycard-ticks"></div>
            <div class="bar-groups" id="bycard-groups" style="position:absolute;left:0;right:0;top:0;bottom:0;"></div>
          </div>
          <div class="chart-labels" id="bycard-labels"></div>
        </section>

      </div>

      <div class="col-right">

        <section class="panel">
          <h2>カテゴリ別の集計</h2>
          <div class="sub" id="merchant-sub"></div>
          <div id="merchant-rows"></div>
          <div id="merchant-empty" class="empty hidden">この月の確定済み明細がありません。</div>
        </section>

        <section class="panel">
          <h2>今月の状況・改善案</h2>
          <div class="sub" id="insights-sub"></div>
          <div id="insights-body"></div>
        </section>

      </div>
    </div>

    <p class="muted">集計対象は「確定」済みの明細のみです。「要確認」のままの明細は、明細一覧で確定するとここに反映されます。</p>
  </main>

<script>
  const PALETTE = ['#2A78D6', '#EB6834', '#1BAF7A', '#EDA100', '#E87BA4', '#008300', '#4A3AA7', '#E34948'];

  // グラフの表示期間（月数）。'all' はデータのある全期間。選んだ期間はこのブラウザに記憶する
  const SPAN_KEYS = ['6', '12', '24', 'all'];
  const SPAN_STORAGE_KEY = 'analysis.trendSpan';
  function loadSpanPref() {
    try {
      const v = localStorage.getItem(SPAN_STORAGE_KEY);
      return SPAN_KEYS.includes(v) ? v : '6';
    } catch (e) { return '6'; }
  }

  const today = new Date();
  const state = {
    session: null,
    cards: [],
    year: today.getFullYear(),
    month: today.getMonth() + 1,
    viewEnd: { year: today.getFullYear(), month: today.getMonth() + 1 }, // グラフに表示する期間の最後の月
    spanKey: loadSpanPref(),
    monthMap: {},   // 'YYYY-MM-01' -> 月ごとの集計（全期間）
    bounds: null,   // { earliest, latest }（monthIndex の値）
    monthsData: [], // [{year, month, total, byCard:{cardId:sum}, categories:{categoryName:sum}}]
    tableView: false,
    loading: true
  };

  const errorBanner = document.getElementById('error-banner');

  function showError(msg) {
    if (!msg) { errorBanner.classList.add('hidden'); return; }
    errorBanner.textContent = msg;
    errorBanner.classList.remove('hidden');
  }

  function fmt(n) { return Math.round(n).toLocaleString('ja-JP'); }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (m) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
  }
  function cardColor(idx) { return PALETTE[idx % PALETTE.length]; }
  function isoMonthStart(y, m) { return y + '-' + String(m).padStart(2, '0') + '-01'; }

  function windowMonths(endYear, endMonth) {
    const arr = [];
    let y = endYear, m = endMonth;
    const n = spanMonths();
    for (let i = 0; i < n; i++) {
      arr.unshift({ year: y, month: m });
      m -= 1;
      if (m < 1) { m = 12; y -= 1; }
    }
    return arr;
  }

  async function loadCards() {
    const { data, error } = await supabaseClient.from('cards').select('*').order('sort_order', { ascending: true });
    if (error) { showError('カード読み込みエラー: ' + error.message); return; }
    state.cards = data;
  }

  function monthIndex(y, m) { return y * 12 + (m - 1); }
  function fromIndex(idx) { return { year: Math.floor(idx / 12), month: (idx % 12) + 1 }; }
  function emptyAgg(y, m) {
    return { year: y, month: m, total: 0, byCard: {}, categories: {}, merchantsByCategory: {}, merchants: {}, sharedTotal: 0, sharedCount: 0 };
  }
  function aggFor(y, m) { return state.monthMap[isoMonthStart(y, m)] || emptyAgg(y, m); }

  // 確定済み明細を全期間ぶん一度だけ読み込み、月ごとに集計しておく。
  // 月の切り替えやグラフの移動は再読み込みなしで即座に反映される。
  async function loadAllData() {
    state.loading = true;
    renderAll();

    const rows = [];
    const PAGE = 1000; // Supabaseの1回あたりの上限に合わせて分割取得
    for (let from = 0; ; from += PAGE) {
      const { data, error } = await supabaseClient
        .from('card_statements')
        .select('id, billing_month, card_id, amount, merchant, category, is_shared')
        .eq('status', 'confirmed')
        .order('billing_month', { ascending: true })
        .order('id', { ascending: true })
        .range(from, from + PAGE - 1);
      if (error) {
        state.loading = false;
        showError('集計データの読み込みエラー: ' + error.message);
        state.monthMap = {};
        state.bounds = null;
        refreshWindow();
        renderAll();
        return;
      }
      rows.push(...data);
      if (data.length < PAGE) break;
    }
    showError(null);

    const map = {};
    rows.forEach((r) => {
      const key = r.billing_month.slice(0, 10);
      if (!map[key]) {
        const [y, m] = key.split('-').map(Number);
        map[key] = emptyAgg(y, m);
      }
      const a = map[key];
      const amount = Number(r.amount);
      const categoryKey = r.category || '未分類';
      a.byCard[r.card_id] = (a.byCard[r.card_id] || 0) + amount;
      a.categories[categoryKey] = (a.categories[categoryKey] || 0) + amount;
      if (!a.merchantsByCategory[categoryKey]) a.merchantsByCategory[categoryKey] = {};
      a.merchantsByCategory[categoryKey][r.merchant] = (a.merchantsByCategory[categoryKey][r.merchant] || 0) + amount;
      a.total += amount;
      if (r.is_shared) { a.sharedTotal += amount; a.sharedCount += 1; }
      // 利用先ごと（表記ゆれをまとめたキー）の金額・回数。状況・改善案の分析に使う
      const mKey = merchantKey(r.merchant);
      const me = a.merchants[mKey] || (a.merchants[mKey] = {
        name: merchantLabel(r.merchant), amount: 0, count: 0, shared: 0, category: categoryKey, kind: merchantKind(r.merchant, categoryKey)
      });
      me.amount += amount;
      me.count += 1;
      if (r.is_shared) me.shared += amount;
    });
    state.monthMap = map;

    const dataIdx = Object.values(map).map((a) => monthIndex(a.year, a.month));
    const todayIdx = monthIndex(today.getFullYear(), today.getMonth() + 1);
    state.bounds = dataIdx.length
      ? { earliest: Math.min(...dataIdx), latest: Math.max(todayIdx, ...dataIdx) }
      : { earliest: todayIdx, latest: todayIdx };

    state.loading = false;
    clampViewEnd();
    refreshWindow();
    renderAll();
  }

  function spanMonths() {
    if (state.spanKey === 'all') {
      return state.bounds ? Math.max(6, state.bounds.latest - state.bounds.earliest + 1) : 6;
    }
    return Number(state.spanKey);
  }
  // ボタン1回で動かす月数（6か月表示なら1か月、2年表示なら4か月）
  function navStep() { return Math.max(1, Math.round(spanMonths() / 6)); }
  function hasDataAt(m) {
    if (!state.bounds) return false;
    const i = monthIndex(m.year, m.month);
    return i >= state.bounds.earliest && i <= state.bounds.latest;
  }
  function clampViewEnd() {
    const lim = viewEndLimits();
    if (!lim) return;
    const cur = monthIndex(state.viewEnd.year, state.viewEnd.month);
    state.viewEnd = fromIndex(Math.max(lim.min, Math.min(lim.max, cur)));
  }
  function setSpan(key) {
    if (!SPAN_KEYS.includes(key) || key === state.spanKey) return;
    state.spanKey = key;
    try { localStorage.setItem(SPAN_STORAGE_KEY, key); } catch (e) { /* 保存できなくても表示は切り替える */ }
    // 選択中の月がグラフ内に入る位置に合わせる
    const n = spanMonths();
    const sel = monthIndex(state.year, state.month);
    let end = monthIndex(state.viewEnd.year, state.viewEnd.month);
    if (sel > end) end = sel;
    else if (sel < end - (n - 1)) end = sel + n - 1;
    state.viewEnd = fromIndex(end);
    clampViewEnd();
    refreshWindow();
    renderAll();
  }

  function refreshWindow() {
    state.monthsData = windowMonths(state.viewEnd.year, state.viewEnd.month).map((m) => aggFor(m.year, m.month));
  }

  // グラフを delta か月ぶん左右に動かす（選択中の月はそのまま）
  function viewEndLimits() {
    if (!state.bounds) return null;
    const { earliest, latest } = state.bounds;
    return { min: Math.min(earliest + spanMonths() - 1, latest), max: latest };
  }
  function shiftWindow(delta) {
    const lim = viewEndLimits();
    if (!lim) return;
    const cur = monthIndex(state.viewEnd.year, state.viewEnd.month);
    const next = Math.max(lim.min, Math.min(lim.max, cur + delta));
    if (next === cur) return;
    state.viewEnd = fromIndex(next);
    refreshWindow();
    renderAll();
  }
  function jumpToLatest() {
    const lim = viewEndLimits();
    if (!lim) return;
    state.viewEnd = fromIndex(lim.max);
    refreshWindow();
    renderAll();
  }

  // 月を選ぶ。選んだ月がグラフの外なら、見える位置までだけグラフを動かす
  function selectMonth(y, m) {
    state.year = y; state.month = m;
    const sel = monthIndex(y, m);
    const end = monthIndex(state.viewEnd.year, state.viewEnd.month);
    if (sel > end) state.viewEnd = fromIndex(sel);
    else if (sel < end - (spanMonths() - 1)) state.viewEnd = fromIndex(sel + spanMonths() - 1);
    refreshWindow();
    renderAll();
  }

  function selectedIndexInWindow() {
    return state.monthsData.findIndex((m) => m.year === state.year && m.month === state.month);
  }

  function rangeLabel() {
    const first = state.monthsData[0];
    const last = state.monthsData[state.monthsData.length - 1];
    if (!first || !last) return '';
    return first.year === last.year
      ? `${first.year}年${first.month}月〜${last.month}月支払`
      : `${first.year}年${first.month}月〜${last.year}年${last.month}月支払`;
  }

  // 月ラベル。月数が多くて詰まる場合は間引き（最新の月は必ず表示）、年が変わる所に年を添える
  function monthLabelsHtml(selIdx) {
    const n = state.monthsData.length;
    const width = document.getElementById('bycard-groups').clientWidth
      || document.querySelector('#trend-chart-view .chart-wrap').clientWidth || 600;
    const slotPx = width / Math.max(1, n);
    const step = slotPx >= 34 ? 1 : slotPx >= 17 ? 2 : slotPx >= 11 ? 3 : 6;
    let prevYear = null;
    return state.monthsData.map((m, i) => {
      if ((n - 1 - i) % step !== 0) return '<span></span>';
      const withYear = n > 6 && prevYear !== m.year;
      prevYear = m.year;
      return `<span class="${i === selIdx ? 'active' : ''}">${m.month}月${withYear ? `<small>${m.year}</small>` : ''}</span>`;
    }).join('');
  }

  function renderAll() {
    document.getElementById('month-label').textContent = state.year + '年' + state.month + '月支払分';

    if (state.loading) {
      document.getElementById('hero-loading').classList.remove('hidden');
      document.getElementById('hero').classList.add('hidden');
      return;
    }
    document.getElementById('hero-loading').classList.add('hidden');
    document.getElementById('hero').classList.remove('hidden');

    renderHero();
    renderFixed();
    renderTrend();
    renderByCard();
    renderCategories();
    renderInsights();
  }

  const FIXED_CATEGORIES = ['固定費', '水道光熱', '通信'];

  function renderFixed() {
    const cur = currentMonthData();
    const prev = prevMonthData();
    if (!cur) return;

    document.getElementById('fixed-sub').textContent = state.year + '年' + state.month + '月支払分';

    const fixedTotal = FIXED_CATEGORIES.reduce((sum, name) => sum + (cur.categories[name] || 0), 0);
    const ratio = cur.total > 0 ? Math.round((fixedTotal / cur.total) * 100) : 0;
    document.getElementById('fixed-ratio-badge').textContent = '支出全体の ' + ratio + '%';

    const tiles = FIXED_CATEGORIES.map((name) => {
      const v = cur.categories[name] || 0;
      return `
        <div class="fixed-tile">
          <span class="name">${escapeHtml(name)}</span>
          <span class="amount">${fmt(v)}<span style="margin-left:2px;font-size:12px;font-weight:500;color:var(--text-sub);">円</span></span>
        </div>`;
    }).join('');
    const totalTile = `
        <div class="fixed-tile total">
          <span class="name">3カテゴリ合計</span>
          <span class="amount">${fmt(fixedTotal)}<span style="margin-left:2px;font-size:12px;font-weight:500;color:var(--text-sub);">円</span></span>
        </div>`;
    document.getElementById('fixed-summary').innerHTML = tiles + totalTile;

    const items = Object.entries(cur.merchantsByCategory['固定費'] || {}).sort((a, b) => b[1] - a[1]);
    document.getElementById('fixed-empty').classList.toggle('hidden', items.length > 0);
    document.getElementById('fixed-item-list').innerHTML = items.map(([name, v]) =>
      `<div class="fixed-item-row"><span>${escapeHtml(name)}</span><span class="amount">${fmt(v)}円</span></div>`
    ).join('');

    const diffEl = document.getElementById('fixed-diff-notes');
    if (prev && prev.total > 0 && !isInProgress(state.year, state.month)) {
      const curNames = new Set(Object.keys(cur.merchantsByCategory['固定費'] || {}));
      const prevNames = new Set(Object.keys(prev.merchantsByCategory['固定費'] || {}));
      const added = [...curNames].filter((n) => !prevNames.has(n));
      const removed = [...prevNames].filter((n) => !curNames.has(n));
      const lines = [];
      if (added.length) {
        lines.push('先月までなかった固定費: ' + added.map((n) => escapeHtml(n)).join('、'));
      }
      if (removed.length) {
        lines.push('先月まであった固定費が今月は見当たりません: ' + removed.map((n) => escapeHtml(n)).join('、') + '（解約済みか確認してみてください）');
      }
      diffEl.innerHTML = lines.map((l) => `<p class="fixed-diff-note">${l}</p>`).join('');
    } else {
      diffEl.innerHTML = '';
    }
  }

  function currentMonthData() {
    return aggFor(state.year, state.month);
  }
  function prevMonthData() {
    const p = fromIndex(monthIndex(state.year, state.month) - 1);
    return aggFor(p.year, p.month);
  }

  function renderHero() {
    const cur = currentMonthData();
    const prev = prevMonthData();
    if (!cur) return;

    document.getElementById('hero-label').textContent = state.year + '年' + state.month + '月支払分の合計（全カード）';
    document.getElementById('hero-total').textContent = fmt(cur.total);

    const deltaEl = document.getElementById('hero-delta');
    if (isInProgress(state.year, state.month)) {
      // まだ締まっていない月は途中までの集計なので、前月と比べない
      deltaEl.textContent = 'まだ締まっていない月（途中までの集計）';
      deltaEl.style.color = 'var(--text-muted)';
    } else if (prev && prev.total > 0) {
      const diff = cur.total - prev.total;
      if (diff === 0) {
        deltaEl.textContent = '前月と同額';
        deltaEl.style.color = 'var(--text-muted)';
      } else {
        const up = diff > 0;
        deltaEl.textContent = (up ? '▲ ' : '▼ ') + '前月より ' + fmt(Math.abs(diff)) + '円 ' + (up ? '増' : '減');
        deltaEl.style.color = up ? 'var(--bad)' : 'var(--good)';
      }
    } else {
      deltaEl.textContent = '前月データなし';
      deltaEl.style.color = 'var(--text-muted)';
    }

    const sharedEl = document.getElementById('hero-shared');
    if (cur.sharedTotal > 0) {
      // 清算対象は割り勘なので、相手の負担分（PARTNER_SHARE）だけを差し引く
      const partner = Math.round(cur.sharedTotal * PARTNER_SHARE);
      sharedEl.textContent = 'うち清算対象 ' + fmt(cur.sharedTotal) + '円（' + cur.sharedCount + '件）→ 相手の負担分 ' +
        fmt(partner) + '円 ／ 実質の自己負担 ' + fmt(cur.total - partner) + '円';
    } else {
      sharedEl.textContent = '';
    }

    document.getElementById('hero-cards').innerHTML = state.cards.map((c, idx) => {
      const amount = cur.byCard[c.id] || 0;
      return `
        <div class="hero-card">
          <span class="name"><span class="sq" style="background:${cardColor(idx)};"></span>${escapeHtml(c.name)}</span>
          <span class="amount">${fmt(amount)}<span style="margin-left:4px;font-size:12px;font-weight:500;color:var(--text-sub);">円</span></span>
          <span class="payday">引落日 ${c.payment_day}日</span>
        </div>`;
    }).join('') || '<span class="muted">カードが登録されていません。</span>';
  }

  function renderTrend() {
    const selIdx = selectedIndexInWindow();
    const n = state.monthsData.length;
    document.getElementById('trend-range').textContent = rangeLabel();
    const lim = viewEndLimits();
    const endIdx = monthIndex(state.viewEnd.year, state.viewEnd.month);
    document.getElementById('trend-older').disabled = !lim || endIdx <= lim.min;
    document.getElementById('trend-newer').disabled = !lim || endIdx >= lim.max;
    document.getElementById('trend-latest').disabled = !lim || endIdx >= lim.max;
    document.querySelectorAll('.span-chip').forEach((b) => {
      const on = b.dataset.span === state.spanKey;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });

    // データの取り込みが始まる前の月は「0円」ではなく「データなし」として点も線も描かない
    const withData = state.monthsData.map(hasDataAt);
    const maxAll = Math.max(1, ...state.monthsData.filter((m, i) => withData[i]).map((m) => m.total));
    const ticks = [0, Math.round(maxAll / 2), maxAll];
    document.getElementById('trend-ticks').innerHTML = ticks.map((v) => {
      const bottom = Math.round((v / maxAll) * 160);
      return `<div class="${v === 0 ? 'zero' : ''}" style="bottom:${bottom}px;"><span>${v === 0 ? '0' : fmt(v / 1000) + 'k'}</span></div>`;
    }).join('');

    // 点（各月の枠の中央）と同じ位置に線の頂点を置く
    const slot = 600 / (n || 1);
    const points = state.monthsData.map((m, i) => withData[i]
      ? Math.round((i + 0.5) * slot) + ',' + (160 - Math.round((m.total / maxAll) * 160))
      : null
    ).filter(Boolean).join(' ');
    document.getElementById('trend-line').setAttribute('points', points);

    document.getElementById('trend-groups').innerHTML = state.monthsData.map((m, i) => {
      const isActive = i === selIdx;
      if (!withData[i]) return `<div class="bar-group ${isActive ? 'active' : ''}"></div>`;
      const dotBottom = Math.round((m.total / maxAll) * 160);
      return `
        <button type="button" class="bar-group ${isActive ? 'active' : ''}" data-month-index="${i}" aria-label="${m.year}年${m.month}月支払 合計${fmt(m.total)}円">
          <span class="dot" style="position:absolute;left:50%;bottom:${dotBottom}px;transform:translate(-50%,50%);background:#2A78D6;border:2px solid #FFFFFF;"></span>
        </button>`;
    }).join('');

    function paintTrendReadout(m) {
      const el = document.getElementById('trend-readout');
      if (!m) { el.innerHTML = ''; return; }
      const head = `<span style="font-weight:700;color:var(--text);">${m.year}年${m.month}月支払分</span>`;
      el.innerHTML = hasDataAt(m) ? `${head} 合計 <strong>${fmt(m.total)}円</strong>` : `${head} データなし`;
    }
    const trendTooltip = document.getElementById('trend-tooltip');
    function showTrendTooltip(btn, m) {
      const wrap = document.querySelector('#trend-chart-view .chart-wrap');
      const wrapRect = wrap.getBoundingClientRect();
      const dotRect = btn.querySelector('.dot').getBoundingClientRect();
      trendTooltip.textContent = (n > 12 ? m.year + '年' : '') + m.month + '月支払 ' + fmt(m.total) + '円';
      trendTooltip.classList.remove('hidden');
      // 端の月でも吹き出しがパネルからはみ出さないよう左右位置を寄せ、矢印は点を指したままにする
      const dotX = dotRect.left + dotRect.width / 2 - wrapRect.left;
      const half = trendTooltip.offsetWidth / 2;
      const marginLeft = parseFloat(getComputedStyle(wrap).marginLeft) || 0;
      const x = Math.min(Math.max(dotX, half - marginLeft), wrapRect.width - half + 8);
      trendTooltip.style.left = Math.round(x) + 'px';
      trendTooltip.style.setProperty('--arrow-x', Math.round(half + dotX - x) + 'px');
      const below = dotRect.top - wrapRect.top < 44;
      trendTooltip.classList.toggle('below', below);
      if (below) {
        trendTooltip.style.bottom = 'auto';
        trendTooltip.style.top = Math.round(dotRect.bottom - wrapRect.top + 10) + 'px';
      } else {
        trendTooltip.style.top = 'auto';
        trendTooltip.style.bottom = Math.round(wrapRect.bottom - dotRect.top + 10) + 'px';
      }
      btn.classList.add('hovered');
      paintTrendReadout(m);
    }
    function hideTrendTooltip(btn) {
      trendTooltip.classList.add('hidden');
      btn.classList.remove('hovered');
      paintTrendReadout(currentMonthData());
    }
    document.querySelectorAll('#trend-groups [data-month-index]').forEach((btn) => {
      const m = state.monthsData[Number(btn.dataset.monthIndex)];
      btn.addEventListener('click', () => selectMonth(m.year, m.month));
      btn.addEventListener('pointerenter', () => showTrendTooltip(btn, m));
      btn.addEventListener('pointerleave', () => hideTrendTooltip(btn));
      btn.addEventListener('focus', () => showTrendTooltip(btn, m));
      btn.addEventListener('blur', () => hideTrendTooltip(btn));
    });

    document.getElementById('trend-labels').innerHTML = monthLabelsHtml(selIdx);

    paintTrendReadout(currentMonthData());

    document.getElementById('trend-table-body').innerHTML = state.monthsData.map((m, i) =>
      `<tr><td style="${i === selIdx ? 'font-weight:700;' : ''}">${m.year}年${m.month}月</td><td class="num">${withData[i] ? fmt(m.total) : '—'}</td></tr>`
    ).join('');
  }

  document.getElementById('trend-toggle').addEventListener('click', () => {
    state.tableView = !state.tableView;
    document.getElementById('trend-toggle').textContent = state.tableView ? 'グラフで見る' : '表で見る';
    document.getElementById('trend-chart-view').classList.toggle('hidden', state.tableView);
    document.getElementById('trend-table-view').classList.toggle('hidden', !state.tableView);
  });

  function renderByCard() {
    document.getElementById('bycard-legend').innerHTML = state.cards.map((c, idx) =>
      `<span><span class="sq" style="background:${cardColor(idx)};"></span>${escapeHtml(c.name)}</span>`
    ).join('');

    // 6か月までは横並びの棒、それより長い期間は月ごとにカードを積み上げた棒にする（棒が細くなりすぎないように）
    const stacked = state.monthsData.length > 6;
    const withData = state.monthsData.map(hasDataAt);
    const monthSum = (m) => state.cards.reduce((s, c) => s + Math.max(0, m.byCard[c.id] || 0), 0);
    const barMax = Math.max(1, ...state.monthsData.map((m, i) => {
      if (!withData[i]) return 0;
      return stacked ? monthSum(m) : Math.max(0, ...state.cards.map((c) => m.byCard[c.id] || 0));
    }));
    const ticks = [0, Math.round(barMax / 2), barMax];
    document.getElementById('bycard-ticks').innerHTML = ticks.map((v) => {
      const bottom = Math.round((v / barMax) * 160);
      return `<div class="${v === 0 ? 'zero' : ''}" style="bottom:${bottom}px;"><span>${v === 0 ? '0' : fmt(v / 1000) + 'k'}</span></div>`;
    }).join('');

    document.getElementById('bycard-sub').textContent = rangeLabel() + (stacked ? '・カード別に積み上げ' : '');

    const selIdx = selectedIndexInWindow();
    const groupsEl = document.getElementById('bycard-groups');
    groupsEl.classList.toggle('stacked', stacked);
    groupsEl.innerHTML = state.monthsData.map((m, i) => {
      const cls = `bar-group ${i === selIdx ? 'active' : ''}`;
      if (!withData[i]) return `<div class="${cls}"></div>`;
      const title = `${m.year}年${m.month}月支払\n` + state.cards.map((c) => `${c.name}: ${fmt(m.byCard[c.id] || 0)}円`).join('\n');
      if (stacked) {
        const segs = state.cards.map((c, idx) => {
          const v = m.byCard[c.id] || 0;
          if (v <= 0) return '';
          return `<span class="seg" style="background:${cardColor(idx)};height:${(v / barMax * 160).toFixed(1)}px;"></span>`;
        }).join('');
        return `<div class="${cls}" title="${escapeHtml(title)}"><span class="stack">${segs}</span></div>`;
      }
      const bars = state.cards.map((c, idx) => {
        const v = m.byCard[c.id] || 0;
        const h = Math.round((v / barMax) * 160);
        return `<span class="bar" style="background:${cardColor(idx)};height:${h}px;"></span>`;
      }).join('');
      return `<div class="${cls}" title="${escapeHtml(title)}">${bars}</div>`;
    }).join('');

    document.getElementById('bycard-labels').innerHTML = monthLabelsHtml(selIdx);
  }

  function renderCategories() {
    const cur = currentMonthData();
    document.getElementById('merchant-sub').textContent = state.year + '年' + state.month + '月支払分・金額の大きい順';
    if (!cur) return;

    const entries = Object.entries(cur.categories).sort((a, b) => b[1] - a[1]);
    document.getElementById('merchant-empty').classList.toggle('hidden', entries.length > 0);

    const max = entries.length ? entries[0][1] : 1;
    document.getElementById('merchant-rows').innerHTML = entries.map(([name, v]) => {
      const widthPct = (v / max * 70).toFixed(1);
      const share = cur.total > 0 ? Math.round((v / cur.total) * 100) : 0;
      return `
        <div class="merchant-row">
          <span class="merchant-name">${escapeHtml(name)}</span>
          <div class="merchant-bar-wrap">
            <span class="merchant-bar" style="width:${widthPct}%;"></span>
            <span class="merchant-value">${fmt(v)}円<span class="merchant-share">${share}%</span></span>
          </div>
        </div>`;
    }).join('');
  }

  // ---------------------------------------------------------------------------
  // 今月の状況・改善案（API呼び出しなし。全期間の集計から決まったルールで文章を作る）
  //  1. まとめ　　　　：特別な出費を除いた「ふだんの生活費」を、いつもの月と比べる
  //  2. 前月からの増減：hero の「前月より○円」の理由を利用先ごとに示す
  //  3. いつもと比べて：いつもより多い／少ないカテゴリと、その主な利用先
  //  4. 特別な出費　　：投資・積立、年1回の支払い、単発の大きな支払い
  //  5. 定期的な支払い：毎月ほぼ同額の支払い（サブスク等）の一覧と変化
  // 「いつもの月」= データのある直近3か月の中央値（一度きりの大きな出費に引っぱられにくい）
  // ---------------------------------------------------------------------------
  const INVEST_RE = /証券|投信|積立|NISA|ニーサ|IDECO|イデコ|確定拠出/i;
  const INVEST_CATEGORIES = ['投資', '貯蓄', '投資・貯蓄'];
  const ANNUAL_RE = /年会費|年額|年払|年間利用料/;
  const ONEOFF_MIN = 10000;   // 単発の大きな支払いとみなす金額（その月の利用先合計）
  const ONEOFF_LOOKBACK = 6;  // この月数のあいだ一度もなかった利用先を「単発」とみなす
  const PARTNER_SHARE = 0.5;  // 清算対象（割り勘）のうち相手が負担する割合

  // 支払月が今月より後＝まだ締まっていない（途中までの集計）
  function isInProgress(y, m) {
    return monthIndex(y, m) > monthIndex(today.getFullYear(), today.getMonth() + 1);
  }

  // 利用先名の表記ゆれを落とした「読みやすい名前」
  //  - 全角→半角、括弧書き（（翌月買付分）〔ネット〕など）を除く
  //  - 末尾の所在地（「東京都 渋谷区」「?千葉県」など）を除く
  //  - 2語目以降の請求番号・URL（「P46AF39499 684488」「WWW.AMAZON.CO」など）を除く
  function cleanMerchant(s) {
    let t = String(s || '').normalize('NFKC')
      .replace(/\s?([\u3099\u309A])/g, '$1').normalize('NFC')   // 半角の濁点「ﾄﾞ」「ト゛」を「ド」に
      .replace(/[(\[〔【「][^)\]〕】」]*[)\]〕】」]/g, ' ')
      .replace(/\s+/g, ' ').trim();
    t = t.replace(/\s+\?*\s*(北海道|東京都|京都府|大阪府|\S{2,3}県)(\s.*)?$/, '');
    const words = t.split(' ');
    const isCode = (w) => /\d{3,}/.test(w) || /\.\w{2,}/.test(w)               // 請求番号・電話番号・URL
      || (/^[A-Z0-9]{5,}$/i.test(w) && (w.match(/\d/g) || []).length >= 2);    // 「P3E42195BA」のような英数字の符号
    t = [words[0], ...words.slice(1).filter((w) => !isCode(w))].join(' ');
    t = t.replace(/([ァ-ヶ])-(?=[ァ-ヶ])/g, '$1ー');
    return t.replace(/\s*\?+$/, '').trim() || String(s || '').trim();
  }
  // 同じ利用先を月をまたいでまとめるためのキー（例：「ＳＢＩ証券投信積立サ－ビス（翌月買付分）」＝「ＳＢＩ証券投信積立サービス」）
  function merchantKey(s) {
    return cleanMerchant(s).replace(/\s+/g, '').replace(/[-‐−ｰ]/g, 'ー').toUpperCase();
  }
  function merchantLabel(s) {
    const t = cleanMerchant(s);
    return t.length > 22 ? t.slice(0, 21) + '…' : t;
  }
  function merchantKind(merchant, category) {
    const n = String(merchant || '').normalize('NFKC');
    if (INVEST_CATEGORIES.includes(category) || INVEST_RE.test(n)) return 'invest';
    if (ANNUAL_RE.test(n)) return 'annual';
    return null;
  }

  function median(arr) {
    if (!arr.length) return 0;
    const s = [...arr].sort((a, b) => a - b);
    const h = Math.floor(s.length / 2);
    return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2;
  }
  function aggAt(idx) { const p = fromIndex(idx); return aggFor(p.year, p.month); }
  function approxYen(v) {
    const a = Math.abs(v);
    if (a >= 10000) return '約' + (Math.round(a / 1000) / 10).toLocaleString('ja-JP') + '万円';
    if (a >= 1000) return '約' + fmt(Math.round(a / 100) * 100) + '円';
    return '約' + fmt(Math.round(a / 10) * 10) + '円';
  }
  function deltaSpan(diff) {
    const color = diff > 0 ? 'var(--bad)' : (diff < 0 ? 'var(--good)' : 'var(--text-sub)');
    const sign = diff > 0 ? '+' : (diff < 0 ? '-' : '');
    return `<span style="color:${color};font-weight:700;">${sign}${fmt(Math.abs(diff))}円</span>`;
  }
  // 「12,345円多め」（赤）／「12,345円少なめ」（緑）
  function amountWord(diff) {
    const color = diff > 0 ? 'var(--bad)' : 'var(--good)';
    return `<span style="color:${color};font-weight:700;">${fmt(Math.abs(diff))}円${diff > 0 ? '多め' : '少なめ'}</span>`;
  }
  function isSmallDiff(diff, refValue) { return Math.abs(diff) < Math.max(1000, Math.abs(refValue) * 0.03); }
  // 「○○より 12,345円多めです」。差が小さいときは「○○とほぼ同じです」
  function comparePhrase(diff, refLabel, refValue) {
    if (isSmallDiff(diff, refValue)) return `${refLabel}とほぼ同じです`;
    return `${refLabel}より${amountWord(diff)}です`;
  }

  // 1か月分の支払いを「ふだんの支払い」と「特別な出費」に分ける
  const classifyCache = new Map();
  function classifyMonth(idx) {
    const a = aggAt(idx);
    if (classifyCache.has(idx) && classifyCache.get(idx).agg === a) return classifyCache.get(idx);
    const prior = [];
    for (let i = 1; i <= ONEOFF_LOOKBACK; i++) prior.push(aggAt(idx - i));
    const canDetectOneoff = prior.filter((p) => p.total > 0).length >= 3;
    const special = { invest: [], annual: [], oneoff: [] };
    const daily = {};
    Object.entries(a.merchants).forEach(([k, m]) => {
      if (m.kind === 'invest') special.invest.push(m);
      else if (m.kind === 'annual') special.annual.push(m);
      else if (canDetectOneoff && m.amount >= ONEOFF_MIN && prior.every((p) => !p.merchants[k] || p.merchants[k].amount <= 0)) special.oneoff.push(m);
      else daily[k] = m;
    });
    // 金額はすべて自己負担ベース（清算対象は相手の負担分を差し引く）
    const own = (m) => m.amount - m.shared * PARTNER_SHARE;
    const sum = (list) => list.reduce((s, m) => s + own(m), 0);
    const dailyByCat = {};
    Object.values(daily).forEach((m) => { dailyByCat[m.category] = (dailyByCat[m.category] || 0) + own(m); });
    const result = {
      agg: a, daily, dailyByCat, special,
      partnerShare: a.sharedTotal * PARTNER_SHARE,
      dailyTotal: sum(Object.values(daily)),
      investTotal: sum(special.invest),
      annualTotal: sum(special.annual),
      oneoffTotal: sum(special.oneoff),
      specialTotal: sum(special.invest) + sum(special.annual) + sum(special.oneoff),
      specialKeys: new Set(Object.keys(a.merchants).filter((k) => !daily[k])),
    };
    classifyCache.set(idx, result);
    return result;
  }
  // 比較に使う過去の月（データのある直近3か月。最大6か月さかのぼる。3か月そろわなければ比較しない）
  function baselineIdx(idx) {
    const out = [];
    for (let i = 1; i <= 6 && out.length < 3; i++) {
      const j = idx - i;
      if (state.bounds && j < state.bounds.earliest) break;
      if (aggAt(j).total > 0) out.push(j);
    }
    return out.length >= 3 ? out : []; // 3か月そろわないうちは比較しない（2か月だと1か月の偏りに引っぱられる）
  }

  function renderInsights() {
    const cur = currentMonthData();
    const subEl = document.getElementById('insights-sub');
    const bodyEl = document.getElementById('insights-body');
    subEl.textContent = state.year + '年' + state.month + '月支払分';

    if (!cur || cur.total <= 0) {
      bodyEl.innerHTML = '<p class="insight-line">この月の確定済み明細がまだありません。</p>';
      return;
    }

    const idx = monthIndex(state.year, state.month);
    const c = classifyMonth(idx);
    const inProgress = isInProgress(state.year, state.month);
    const base = inProgress ? [] : baselineIdx(idx).map(classifyMonth);
    const hasBase = base.length > 0;
    const usualDaily = hasBase ? median(base.map((b) => b.dailyTotal)) : 0;
    const prevA = aggAt(idx - 1);
    const prevC = classifyMonth(idx - 1);
    const listText = (arr) => [...arr].sort((p, q) => q.amount - p.amount)
      .map((m) => `${escapeHtml(m.name)} ${fmt(m.amount)}円`).join('、');

    // ---- いつもと比べて多い／少ないカテゴリ（ポイントにも使う） ----
    const catRows = [];
    if (hasBase) {
      const cats = new Set([...Object.keys(c.dailyByCat), ...base.flatMap((b) => Object.keys(b.dailyByCat))]);
      const merchantKeys = new Set([...Object.keys(c.daily), ...base.flatMap((b) => Object.keys(b.daily))]);
      [...cats].map((cat) => {
        const now = c.dailyByCat[cat] || 0;
        const usual = median(base.map((b) => b.dailyByCat[cat] || 0));
        return { cat, now, usual, d: now - usual };
      }).filter((r) => Math.abs(r.d) >= 5000 && Math.abs(r.d) >= r.usual * 0.3)
        .sort((p, q) => Math.abs(q.d) - Math.abs(p.d)).slice(0, 3)
        .forEach((r) => {
          let best = null;
          merchantKeys.forEach((k) => {
            const now = c.daily[k];
            const past = base.map((b) => b.daily[k]);
            const any = now || past.find(Boolean);
            if (!any || any.category !== r.cat) return;
            const d = (now ? now.amount : 0) - median(past.map((p) => (p ? p.amount : 0)));
            if (!best || (r.d > 0 ? d > best.d : d < best.d)) best = { name: any.name, d };
          });
          r.why = best && Math.sign(best.d) === Math.sign(r.d) && Math.abs(best.d) >= 1000 ? best : null;
          catRows.push(r);
        });
    }

    // ---- 定期的な支払い ----
    const hist = [1, 2, 3].map((i) => aggAt(idx - i));
    const isStable = (amounts) => {
      const v = amounts.filter((x) => x > 0);
      return v.length > 0 && Math.max(...v) / Math.min(...v) <= 1.25;
    };
    const subs = [];
    Object.entries(cur.merchants).forEach(([k, m]) => {
      if (m.kind === 'invest' || m.category === '食費' || m.count > 2) return;
      const past = hist.map((h) => h.merchants[k]).filter(Boolean);
      if (past.length < 2 || past.some((p) => p.count > 2)) return;
      if (!isStable([m.amount, ...past.map((p) => p.amount)])) return;
      const last = hist[0].merchants[k];
      const raised = last && m.count === 1 && last.count === 1 && m.amount - last.amount >= 50 && m.amount > last.amount * 1.05;
      subs.push({ name: m.name, amount: m.amount, before: raised ? last.amount : null });
    });
    const stopped = [];
    Object.entries(hist[0].merchants).forEach(([k, m]) => {
      if (inProgress || cur.merchants[k] || m.kind === 'invest' || m.category === '食費') return;
      const past = hist.map((h) => h.merchants[k]);
      if (past.some((p) => !p || p.count > 2)) return;
      if (!isStable(past.map((p) => p.amount))) return;
      stopped.push(m);
    });
    const unresolved = cur.categories['未分類'] || 0;
    const unresolvedShare = Math.round((unresolved / cur.total) * 100);

    // ===== 今月のポイント（最初の1つ＋重要度の高い順に2つ） =====
    let lead;
    if (inProgress) {
      lead = { tone: 'neutral', html: `まだ締まっていない月です。ここまでの支出は<strong>${fmt(cur.total)}円</strong>（途中までの集計のため、前月やいつもの月とは比べていません）。` };
    } else if (hasBase) {
      const d = c.dailyTotal - usualDaily;
      lead = isSmallDiff(d, usualDaily)
        ? { tone: 'neutral', html: `ふだんの生活費は<strong>${fmt(c.dailyTotal)}円</strong>で、いつもどおりです。` }
        : { tone: d > 0 ? 'bad' : 'good', html: `ふだんの生活費は<strong>${fmt(c.dailyTotal)}円</strong>で、いつもより${amountWord(d)}です。${d < 0 ? 'この調子です。' : '下の内容を見て、一時的なものか確認してみてください。'}` };
    } else {
      lead = { tone: 'neutral', html: `ふだんの生活費は<strong>${fmt(c.dailyTotal)}円</strong>です（比べられる過去の月がまだ少ないため、いつもとの比較はしていません）。` };
    }
    const candidates = [];
    catRows.forEach((r) => {
      const why = r.why ? `主に${escapeHtml(r.why.name)}によるものです。` : '';
      candidates.push(r.usual < 100
        ? { score: r.now, tone: 'bad', html: `いつもはほとんど出ていない「${escapeHtml(r.cat)}」が<strong>${fmt(r.now)}円</strong>あります。${why}心当たりがなければ明細一覧で内容を確認してみてください。` }
        : { score: Math.abs(r.d) * (r.d > 0 ? 1 : 0.6), tone: r.d > 0 ? 'bad' : 'good',
            html: `「${escapeHtml(r.cat)}」がいつもより${amountWord(r.d)}です。${why}` });
    });
    if (c.special.oneoff.length) {
      const sorted = [...c.special.oneoff].sort((p, q) => q.amount - p.amount);
      const more = sorted.length > 1 ? `ほか${sorted.length - 1}件、合計${fmt(c.oneoffTotal)}円` : '';
      candidates.push({ score: c.oneoffTotal * 0.8, tone: 'neutral',
        html: `一度きりの大きな支払い：${escapeHtml(sorted[0].name)} ${fmt(sorted[0].amount)}円${more ? '（' + more + '）' : ''}。ふだんの生活費とは分けて見ています。` });
    }
    subs.filter((x) => x.before).forEach((x) => candidates.push({ score: 30000, tone: 'bad',
      html: `${escapeHtml(x.name)}が${fmt(x.before)}円→<strong>${fmt(x.amount)}円</strong>に上がっています。値上げやプラン変更がないか確認してみてください。` }));
    if (stopped.length) {
      candidates.push({ score: 20000, tone: 'neutral',
        html: `毎月あった${stopped.map((m) => escapeHtml(m.name)).join('、')}の請求が今月はありません。解約済みなら問題ありません（請求の月がずれただけのこともあります）。` });
    }
    if (unresolvedShare >= 5) {
      candidates.push({ score: unresolved, tone: 'neutral',
        html: `「未分類」が${fmt(unresolved)}円（全体の${unresolvedShare}%）あります。明細一覧でカテゴリを設定すると、分析がより正確になります。` });
    }
    const points = [lead, ...candidates.sort((p, q) => q.score - p.score).slice(0, 2)];

    // ===== くわしく見る =====
    const sections = [];

    // 内訳：支出の合計 → 相手の負担分 → 特別な出費 → ふだんの生活費
    const rows = [[`支出の合計${inProgress ? '（途中まで）' : ''}`, cur.total]];
    if (c.partnerShare > 0) rows.push([`清算対象 ${fmt(cur.sharedTotal)}円のうち相手の負担分`, -c.partnerShare]);
    if (c.investTotal > 0) rows.push(['投資・積立', -c.investTotal]);
    if (c.annualTotal > 0) rows.push(['年1回の支払い', -c.annualTotal]);
    if (c.oneoffTotal > 0) rows.push(['一度きりの大きな支払い', -c.oneoffTotal]);
    const breakdown = rows.map(([label, v]) => `<li><span>${label}</span><span>${v < 0 ? '−' : ''}${fmt(Math.abs(v))}円</span></li>`).join('') +
      `<li class="total"><span>ふだんの生活費${hasBase ? `（いつもの月 ${fmt(usualDaily)}円）` : ''}</span><span>${fmt(c.dailyTotal)}円</span></li>`;
    sections.push(['内訳', [`<ul class="insight-breakdown">${breakdown}</ul>`]]);

    // 前月からの増減：特別な出費の出入りはまとめて1行にし、ふだんの支払いの増減を上位3つずつ
    if (!inProgress && prevA.total > 0) {
      const s2 = [`${comparePhrase(cur.total - prevA.total, `前月（${fmt(prevA.total)}円）`, prevA.total)}。`];
      const goneKeys = new Set(Object.keys(prevA.merchants).filter((k) => prevC.specialKeys.has(k) && !cur.merchants[k] && prevA.merchants[k].kind !== 'invest'));
      const goneList = [...goneKeys].map((k) => prevA.merchants[k]);
      if (goneList.length) {
        s2.push(`先月の特別な出費（${listText(goneList.slice(0, 2))}${goneList.length > 2 ? ' ほか' : ''}）がなくなった分：${deltaSpan(-goneList.reduce((s, m) => s + m.amount, 0))}`);
      }
      const newKeys = new Set(Object.keys(cur.merchants).filter((k) => c.specialKeys.has(k) && !prevA.merchants[k] && cur.merchants[k].kind !== 'invest'));
      const newList = [...newKeys].map((k) => cur.merchants[k]);
      if (newList.length) {
        s2.push(`今月の特別な出費（${listText(newList.slice(0, 2))}${newList.length > 2 ? ' ほか' : ''}）の分：${deltaSpan(newList.reduce((s, m) => s + m.amount, 0))}`);
      }
      const keys = new Set([...Object.keys(cur.merchants), ...Object.keys(prevA.merchants)]);
      const deltas = [...keys].filter((k) => !goneKeys.has(k) && !newKeys.has(k)).map((k) => {
        const a = cur.merchants[k], b = prevA.merchants[k];
        return { name: (a || b).name, d: (a ? a.amount : 0) - (b ? b.amount : 0), gone: !a, fresh: !b };
      }).filter((x) => Math.abs(x.d) >= 1000);
      const item = (x) => `${escapeHtml(x.name)} ${deltaSpan(x.d)}${x.gone ? '（今月はなし）' : (x.fresh ? '（先月はなし）' : '')}`;
      const inc = deltas.filter((x) => x.d > 0).sort((p, q) => q.d - p.d).slice(0, 3);
      const dec = deltas.filter((x) => x.d < 0).sort((p, q) => p.d - q.d).slice(0, 3);
      if (inc.length) s2.push('増えた主な支払い：' + inc.map(item).join('、'));
      if (dec.length) s2.push('減った主な支払い：' + dec.map(item).join('、'));
      sections.push(['前月からの増減', s2]);
    }

    // いつもと比べて
    if (hasBase) {
      const s3 = catRows.map((r) => {
        const why = r.why ? `主に${escapeHtml(r.why.name)}（${deltaSpan(r.why.d)}）。` : '';
        return r.usual < 100
          ? `「${escapeHtml(r.cat)}」${fmt(r.now)}円：いつもはほとんど出ていない支出です。${why}`
          : `「${escapeHtml(r.cat)}」${fmt(r.now)}円：いつも（${approxYen(r.usual)}）より${amountWord(r.d)}。${why}`;
      });
      if (!s3.length) s3.push('カテゴリごとに見ても、いつもと大きく違うところはありません。');
      const freq = Object.values(c.daily).filter((m) => m.count >= 8).sort((p, q) => q.count - p.count)[0];
      if (freq) s3.push(`よく使うお店：${escapeHtml(freq.name)}で${freq.count}回、合計${fmt(freq.amount)}円（1回あたり${approxYen(freq.amount / freq.count)}）。`);
      sections.push(['いつもと比べて', s3]);
    }

    // 特別な出費
    const s4 = [];
    if (c.special.invest.length) s4.push(`投資・積立：${listText(c.special.invest)}（将来に回したお金なので、生活費とは分けています）`);
    if (c.special.annual.length) s4.push(`年1回の支払い：${listText(c.special.annual)}（1か月あたり${approxYen(c.annualTotal / 12)}）`);
    if (c.special.oneoff.length) s4.push(`一度きりの大きな支払い：${listText(c.special.oneoff)}（過去${ONEOFF_LOOKBACK}か月になかった1万円以上の支払い）`);
    if (s4.length) sections.push(['特別な出費', s4]);

    // 定期的な支払い
    if (subs.length || stopped.length) {
      const s5 = [];
      if (subs.length) {
        const t = subs.reduce((s, x) => s + x.amount, 0);
        s5.push(`毎月ほぼ同じ金額の支払い ${subs.length}件・<strong>月${fmt(t)}円</strong>（年間${approxYen(t * 12)}）：${listText(subs)}`);
        const ups = subs.filter((x) => x.before);
        if (ups.length) {
          s5.push('先月より金額が上がった支払い：' + ups.map((x) => `${escapeHtml(x.name)}（${fmt(x.before)}円→${fmt(x.amount)}円）`).join('、'));
        }
      }
      if (stopped.length) s5.push(`今月は請求が見当たらない：${stopped.map((m) => escapeHtml(m.name)).join('、')}`);
      sections.push(['定期的な支払い', s5]);
    }

    const sectionsHtml = sections.map(([title, lines]) =>
      `<div class="insight-section"><h3>${title}</h3>${lines.map((l) => l.startsWith('<ul') ? l : `<p class="insight-line">${l}</p>`).join('')}</div>`
    ).join('');
    bodyEl.innerHTML =
      `<ul class="insight-points">${points.map((p) => `<li class="tone-${p.tone}">${p.html}</li>`).join('')}</ul>` +
      `<details class="insight-details"${state.insightsOpen ? ' open' : ''}><summary>くわしく見る</summary>${sectionsHtml}` +
      (hasBase ? '<p class="insight-note">※「いつもの月」「いつも」は、データのある直近3か月の中央値（真ん中の値）です。一度きりの大きな出費に引っぱられにくい比べ方です。金額は清算対象の相手の負担分を除いた自己負担です。</p>' : '') +
      '</details>';
    const det = bodyEl.querySelector('details');
    det.addEventListener('toggle', () => { state.insightsOpen = det.open; });
  }

  document.getElementById('prev-month').addEventListener('click', () => {
    const p = fromIndex(monthIndex(state.year, state.month) - 1);
    selectMonth(p.year, p.month);
  });
  document.getElementById('next-month').addEventListener('click', () => {
    const n = fromIndex(monthIndex(state.year, state.month) + 1);
    selectMonth(n.year, n.month);
  });

  // グラフの左右移動：ボタン・スワイプ（ドラッグ）・トラックパッドの横スクロール
  document.getElementById('trend-older').addEventListener('click', () => shiftWindow(-navStep()));
  document.getElementById('trend-newer').addEventListener('click', () => shiftWindow(navStep()));
  document.getElementById('trend-latest').addEventListener('click', jumpToLatest);
  document.querySelectorAll('.span-chip').forEach((b) => {
    b.addEventListener('click', () => setSpan(b.dataset.span));
  });

  // 画面幅が変わったら月ラベルの間引き方を計算し直す
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (!state.loading && state.monthsData.length) { renderTrend(); renderByCard(); }
    }, 150);
  });

  (() => {
    const wrap = document.querySelector('#trend-chart-view .chart-wrap');
    const SWIPE_PX = 40;   // これ以上横に動かしたらスワイプ扱い
    // 指（マウス）で動かした距離ぶんだけグラフが動く（1か月の幅ごとに1か月）
    const slotPx = () => wrap.clientWidth / Math.max(1, state.monthsData.length);
    let startX = null;
    let swiped = false;
    wrap.addEventListener('pointerdown', (e) => { startX = e.clientX; swiped = false; });
    wrap.addEventListener('pointerup', (e) => {
      if (startX === null) return;
      const dx = e.clientX - startX;
      startX = null;
      if (Math.abs(dx) >= SWIPE_PX) {
        swiped = true;
        const months = Math.max(1, Math.round(Math.abs(dx) / slotPx()));
        shiftWindow(dx < 0 ? months : -months); // 左へスワイプ＝新しい月へ
      }
    });
    wrap.addEventListener('pointercancel', () => { startX = null; });
    // スワイプ直後のクリックで月が切り替わらないようにする
    wrap.addEventListener('click', (e) => {
      if (swiped) { e.stopPropagation(); e.preventDefault(); swiped = false; }
    }, true);

    let wheelAcc = 0;
    wrap.addEventListener('wheel', (e) => {
      if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return; // 縦スクロールはページに任せる
      e.preventDefault();
      wheelAcc += e.deltaX;
      if (Math.abs(wheelAcc) >= Math.max(40, slotPx())) {
        shiftWindow(wheelAcc > 0 ? 1 : -1);
        wheelAcc = 0;
      }
    }, { passive: false });
  })();

  (async () => {
    const session = await requireAuth();
    if (!session) return;
    state.session = session;
    await loadCards();
    await loadAllData();
  })();
</script>

</body>
</html>
